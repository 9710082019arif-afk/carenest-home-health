<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Riya Shaikh — Founder &amp; Managing Director">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D3B66"/><stop offset="100%" stop-color="#0A2E4F"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/><stop offset="100%" stop-color="#B8892B"/>
    </linearGradient>
    <linearGradient id="tealG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20B2AA"/><stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgG)"/>
  <!-- decorative arcs (nest motif from brand) -->
  <path d="M 40 470 Q 200 260 360 470" fill="none" stroke="url(#tealG)" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <path d="M 70 480 Q 200 300 330 480" fill="none" stroke="url(#goldG)" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <!-- monogram RS -->
  <g transform="translate(200 220)" font-family="'Cormorant Garamond', 'Georgia', serif">
    <text x="0" y="0" font-size="180" font-weight="500" fill="url(#goldG)" text-anchor="middle" dominant-baseline="middle">RS</text>
  </g>
  <!-- hairline divider -->
  <line x1="130" y1="330" x2="270" y2="330" stroke="url(#goldG)" stroke-width="1" opacity="0.6"/>
  <text x="200" y="365" font-family="'Manrope', system-ui, sans-serif" font-size="15" letter-spacing="4" fill="#E5C158" text-anchor="middle" font-weight="700">FOUNDER · MANAGING DIRECTOR</text>
  <text x="200" y="420" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="500">Riya Shaikh</text>
  <text x="200" y="450" font-family="'Manrope', system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#94A3B8" text-anchor="middle">CARENEST HOME HEALTH · INDIA</text>
</svg>
