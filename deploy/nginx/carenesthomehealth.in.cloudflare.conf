# CareNest HTTPS site (Cloudflare Origin Certificate)
# Placeholders: __DOMAIN__ __WWW_DOMAIN__ __DOCROOT__ __CF_CERT__ __CF_KEY__

upstream carenest_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ __WWW_DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __WWW_DOMAIN__;

    ssl_certificate     __CF_CERT__;
    ssl_certificate_key __CF_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     __CF_CERT__;
    ssl_certificate_key __CF_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root __DOCROOT__;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://carenest_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/chat/stream {
        proxy_pass http://carenest_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /brand-kit/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        # Prefer prerendered index.html without trailing-slash 301
        try_files $uri $uri/index.html /index.html;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/carenest.access.log;
    error_log  /var/log/nginx/carenest.error.log;
}
