# CareNest — Nginx site config
# Install:
#   sudo cp deploy/nginx/carenesthomehealth.in.conf /etc/nginx/sites-available/carenesthomehealth.in
#   sudo ln -sfn /etc/nginx/sites-available/carenesthomehealth.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# After Certbot, certbot will inject ssl_certificate lines into this file
# (or use the Cloudflare origin cert block at the bottom).

upstream carenest_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP → HTTPS (Certbot may manage this; keep as fallback)
server {
    listen 80;
    listen [::]:80;
    server_name carenesthomehealth.in www.carenesthomehealth.in;

    # ACME challenge (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://carenesthomehealth.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.carenesthomehealth.in;

    # Certbot-managed paths (adjust if using Cloudflare origin certs)
    ssl_certificate     /etc/letsencrypt/live/carenesthomehealth.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carenesthomehealth.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://carenesthomehealth.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name carenesthomehealth.in;

    ssl_certificate     /etc/letsencrypt/live/carenesthomehealth.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carenesthomehealth.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Cloudflare origin cert alternative (uncomment & comment Let's Encrypt above) ---
    # ssl_certificate     /etc/ssl/cloudflare/carenest.pem;
    # ssl_certificate_key /etc/ssl/cloudflare/carenest.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/carenest/frontend;
    index index.html;

    client_max_body_size 10m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # HSTS — enable only after SSL is stable end-to-end
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---------- FastAPI ----------
    location /api/ {
        proxy_pass http://carenest_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE chat — disable buffering
    location = /api/chat/stream {
        proxy_pass http://carenest_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # ---------- React static ----------
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /brand-kit/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — serve prerendered dirs without trailing-slash 301
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/carenest.access.log;
    error_log  /var/log/nginx/carenest.error.log;
}
