# CareNest HTTP bootstrap site (pre-SSL / ACME)
# Placeholders: __DOMAIN__ __WWW_DOMAIN__ __DOCROOT__

upstream carenest_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    # default_server: under SSL_MODE=none this must own :80. Without it,
    # a missing/broken sites-enabled symlink leaves nginx active but with
    # no listener — curl to 127.0.0.1 returns HTTP 000.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__ __WWW_DOMAIN__;

    root __DOCROOT__;
    index index.html;
    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://carenest_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/chat/stream {
        proxy_pass http://carenest_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /brand-kit/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SEO 301s — requires /etc/nginx/conf.d/carenest-redirects.conf
    if ($carenest_redirect != "") {
        return 301 $carenest_redirect;
    }

    location / {
        # Prefer prerendered index.html without trailing-slash 301
        # (prerender writes locations/index.html, services/index.html, etc.)
        try_files $uri $uri/index.html /index.html;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/carenest.access.log;
    error_log  /var/log/nginx/carenest.error.log;
}
